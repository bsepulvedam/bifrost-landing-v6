server {
    listen 8080;
    server_name _;
    root /srv/bifrost;
    server_tokens off;
    autoindex off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript;

    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
