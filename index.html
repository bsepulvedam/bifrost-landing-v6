<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta
    name="description"
    content="Bifröst — Producción audiovisual y marketing."
  >
  <title>Bifröst</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>

<body>
  <a class="skip-link" href="#contenido">Saltar al contenido principal</a>

  <!-- =========================
       PÁGINA PRINCIPAL
  ========================== -->
  <div class="site" id="site">

    <!-- Encabezado -->
    <header class="site-header">
      <a class="brand-area" href="index.html" aria-label="Bifröst, inicio" aria-current="page">
        <span class="brand">
          <img
            src="assets/bifrost-logo.png"
            alt=""
            width="519"
            height="457"
          >
        </span>
      </a>

      <nav class="main-nav" aria-label="Navegación principal">
        <a href="producciones.html">Producciones</a>
        <a href="soluciones.html">Soluciones</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="clientes.html">Clientes</a>
        <a class="nav-cta" href="contacto.html">Contacto</a>
      </nav>
    </header>

    <main id="contenido" tabindex="-1">
      <!-- Galería de clientes -->
      <section class="clients" id="clientes" aria-labelledby="clients-title">
        <div class="clients__heading">
          <h1 id="clients-title">Clientes</h1>

          <div class="slider-controls" role="group" aria-label="Controles de la galería" hidden>
            <button
              class="slider-button"
              id="previousClient"
              type="button"
              aria-label="Ver clientes anteriores"
              aria-controls="clientSlider"
              aria-disabled="true"
            >
              Anterior
            </button>

            <button
              class="slider-button"
              id="nextClient"
              type="button"
              aria-label="Ver clientes siguientes"
              aria-controls="clientSlider"
              aria-disabled="true"
            >
              Siguiente
            </button>
          </div>
        </div>

        <div
          class="client-slider"
          id="clientSlider"
          tabindex="0"
          role="group"
          aria-label="Galería desplazable de clientes"
          aria-describedby="sliderHint"
        >
          <a class="client-card" href="clientes.html#adidas">
            <img class="client-card__poster" src="assets/clientes/posters/adidas.webp"
              alt="" width="1280" height="720" draggable="false" fetchpriority="high">
            <img class="client-card__logo" src="assets/clientes/logos/adidas.svg"
              alt="Adidas" width="2000" height="1000" draggable="false">
          </a>

          <a class="client-card" href="clientes.html#samsung">
            <img class="client-card__poster" src="assets/clientes/posters/samsung.webp"
              alt="" width="1280" height="720" draggable="false">
            <img class="client-card__logo" src="assets/clientes/logos/samsung.svg"
              alt="Samsung" width="2000" height="1000" draggable="false">
          </a>

          <a class="client-card" href="clientes.html#hbo-max">
            <img class="client-card__poster" src="assets/clientes/posters/hbo-max.webp"
              alt="" width="1280" height="720" draggable="false">
            <img class="client-card__logo" src="assets/clientes/logos/hbo-max.svg"
              alt="HBO Max" width="2000" height="1000" draggable="false">
          </a>

          <a class="client-card" href="clientes.html#salcobrand">
            <img class="client-card__poster" src="assets/clientes/posters/salcobrand.webp"
              alt="" width="1280" height="720" draggable="false" loading="lazy">
            <img class="client-card__logo" src="assets/clientes/logos/salcobrand.svg"
              alt="Salcobrand" width="2000" height="1000" draggable="false" loading="lazy">
          </a>

          <a class="client-card" href="clientes.html#score">
            <img class="client-card__poster" src="assets/clientes/posters/score.webp"
              alt="" width="1280" height="720" draggable="false" loading="lazy">
            <img class="client-card__logo" src="assets/clientes/logos/score.svg"
              alt="Score" width="2000" height="1000" draggable="false" loading="lazy">
          </a>
        </div>

        <p class="slider-hint" id="sliderHint">
          Desliza, arrastra o utiliza las flechas para recorrer la galería.
        </p>
      </section>

      <div class="home-links">
        <a href="index.html">Inicio</a>
        <a href="producciones.html">Producciones Audiovisuales+IA</a>
      </div>
    </main>

    <!-- Footer ilustrado -->
    <footer class="site-footer" id="contacto">
      <img
        src="assets/bifrost-footer.png"
        alt=""
        width="2048"
        height="392"
      >
    </footer>

  </div>

</body>
</html>
